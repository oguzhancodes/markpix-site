<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MarkPix App Icon — Terrain Pin (vektör) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="map" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E314D"/>
      <stop offset="100%" stop-color="#0E1A2E"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A4C"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <clipPath id="mapclip">
      <polygon points="338,614 686,614 799,840 225,840"/>
    </clipPath>
  </defs>

  <!-- Zemin -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Perspektif harita düzlemi -->
  <polygon points="338,614 686,614 799,840 225,840" fill="url(#map)"/>
  <g clip-path="url(#mapclip)">
    <g fill="none" stroke="#3C5170" stroke-width="5" opacity="0.55">
      <path d="M205,660 Q 360,646 512,660 T 819,660"/>
      <path d="M205,727 Q 360,713 512,727 T 819,727"/>
      <path d="M205,793 Q 360,779 512,793 T 819,793"/>
    </g>
    <g stroke="#2E86AB" stroke-width="3" opacity="0.30">
      <line x1="410" y1="614" x2="410" y2="840"/>
      <line x1="614" y1="614" x2="614" y2="840"/>
      <line x1="251" y1="686" x2="773" y2="686"/>
      <line x1="251" y1="763" x2="773" y2="763"/>
    </g>
  </g>

  <!-- Pin alt gölgesi -->
  <ellipse cx="512" cy="722" rx="107" ry="27" fill="#000000" opacity="0.35"/>

  <!-- Pin ucu kontur halkaları -->
  <g fill="none" stroke="#3C5170" stroke-width="4" opacity="0.5">
    <ellipse cx="512" cy="707" rx="77" ry="20"/>
    <ellipse cx="512" cy="707" rx="46" ry="12"/>
  </g>

  <!-- Konum pini (teardrop) -->
  <path d="M393,470 A133,133 0 1 1 631,470 L512,707 Z" fill="url(#pin)"/>
  <circle cx="512" cy="410" r="43" fill="#FFFFFF"/>

  <!-- Crosshair (kesin koordinat) -->
  <g stroke="#FF6B35" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="461" y1="707" x2="563" y2="707"/>
    <line x1="512" y1="676" x2="512" y2="738"/>
  </g>
  <circle cx="512" cy="707" r="46" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.55"/>

  <!-- Vizör köşeleri (foto/kamera çerçeve) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <path d="M246 159 L159 159 L159 246"/>
    <path d="M778 159 L865 159 L865 246"/>
    <path d="M246 865 L159 865 L159 778"/>
    <path d="M778 865 L865 865 L865 778"/>
  </g>
</svg>
